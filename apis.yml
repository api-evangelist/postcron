name: Postcron
description: >-
  Postcron is a social media scheduling and publishing tool that lets marketers,
  agencies, and small businesses plan, schedule, and automatically publish content
  across Instagram, Facebook, X (Twitter), LinkedIn, Pinterest, and TikTok from a
  single dashboard. It supports bulk uploading up to 1,000 posts from Excel or Google
  Docs, multi-account and team management, automatic image watermarking, a browser
  extension, and mobile apps for iOS and Android. Originally a Y Combinator / 500
  Global-backed startup, Postcron is a consumer- and SMB-facing publishing product;
  it exposes an internal application API used by its own clients but does not publish
  a documented public developer API, OpenAPI specification, SDKs, or a developer portal.
